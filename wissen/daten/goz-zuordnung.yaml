
stand: GOZ 2012, Anlage 1 (Gebührenverzeichnis für zahnärztliche Leistungen)
quelle: gesetze-im-internet.de, Anlage 1 zur GOZ, geltende Fassung
abgerufen: 2026-08-11

hinweis: >
  Auszug für Schulungszwecke. Abgebildet sind ausschließlich die
  Gebührennummern der Anlage 1 zur GOZ. Nicht enthalten sind: analoge
  Berechnungen nach Paragraf 6 Absatz 1 GOZ und der weit überwiegende Teil
  der Leistungen nach der Gebührenordnung für Ärzte, die der Zahnarzt nach
  Paragraf 6 Absatz 2 GOZ berechnen darf - von ihnen führt
  wissen/daten/goae-auszug.yaml nur die wenigen Nummern, die im Lab
  tatsächlich vorkommen. Positionen ganz ohne Gebührennummer - Material und
  Labor nach Paragraf 9 GOZ, Verlangensleistungen nach Paragraf 2 Absatz 3
  GOZ - stehen unter ohne_gebuehrennummer und folgen dort einer Regel statt
  einer Nummer. Eine Rechnungsprüfung, die nur diese Datei kennt, trifft
  daher weiterhin auf Positionen, die sie nicht kennt.

abdeckung:
  - abschnitt: A
    bezeichnung: Allgemeine zahnärztliche Leistungen
    grad: vollständig
    positionen: 12
    anmerkung: >
      Überwiegend keinem Leistungsbereich zuzuordnen: Untersuchung, Planung,
      Abformung und Zuschläge dienen der jeweiligen Hauptbehandlung.
  - abschnitt: B
    bezeichnung: Prophylaktische Leistungen
    grad: vollständig
    positionen: 5
    anmerkung: Vollständig PZR.
  - abschnitt: C
    bezeichnung: Konservierende Leistungen
    grad: vollständig
    positionen: 44
    anmerkung: >
      Der Abschnitt trennt die drei im Modell benachbarten Bereiche ZERH, INL
      und ZE. Hier liegen die meisten Abgrenzungsentscheidungen.
  - abschnitt: D
    bezeichnung: Chirurgische Leistungen
    grad: vollständig
    positionen: 29
    anmerkung: >
      Der dünnste Abschnitt gemessen an der Zuordnungsquote. Zahnentfernung,
      Blutstillung und Wundversorgung sind weder Zahnerhalt noch Zahnersatz und
      fallen aus dem Modell heraus.
  - abschnitt: E
    bezeichnung: Leistungen bei Erkrankungen der Mundschleimhaut und des Parodontiums
    grad: vollständig
    positionen: 21
    anmerkung: >
      Überwiegend PAR. Reine Mundschleimhautleistungen betreffen nicht den
      Zahnhalteapparat und fallen aus dem Modell heraus.
  - abschnitt: F
    bezeichnung: Prothetische Leistungen
    grad: vollständig
    positionen: 34
    anmerkung: Bis auf eine Ausnahme vollständig ZE.
  - abschnitt: G
    bezeichnung: Kieferorthopädische Leistungen
    grad: vollständig
    positionen: 27
    anmerkung: Vollständig KFO.
  - abschnitt: H
    bezeichnung: Eingliederung von Aufbissbehelfen und Schienen
    grad: vollständig
    positionen: 11
    anmerkung: >
      Nicht deckungsgleich mit FUN. Die Langzeitprovisorien 7080 bis 7100 sind
      prothetisch, die semipermanente Schiene 7070 parodontal.
  - abschnitt: J
    bezeichnung: Funktionsanalytische und funktionstherapeutische Leistungen
    grad: vollständig
    positionen: 11
    anmerkung: Vollständig FUN.
  - abschnitt: K
    bezeichnung: Implantologische Leistungen
    grad: vollständig
    positionen: 17
    anmerkung: >
      Vollständig IMP. Die Krone auf dem Implantat steht nicht hier, sondern
      unter 2200 und 5000 ff. und gehört zu ZE.
  - abschnitt: L
    bezeichnung: Zuschläge zu bestimmten zahnärztlich-chirurgischen Leistungen
    grad: vollständig
    positionen: 4
    anmerkung: Zuschläge ohne eigenen Leistungsinhalt, keinem Bereich zuzuordnen.

bereiche_ohne_position:
  - leistungsbereich: NAR
    begruendung: >
      Die GOZ kennt keine Nummer für Vollnarkose oder Sedierung. Der Zahnarzt
      berechnet sie nach Paragraf 6 Absatz 2 GOZ über die Gebührenordnung für
      Ärzte. Die drei Anästhesienummern der GOZ (0080, 0090, 0100) sind
      örtliche Betäubung und ausdrücklich kein NAR.
  - leistungsbereich: AKUT
    begruendung: >
      AKUT ist im Modell über die Behandlungssituation definiert -
      unaufschiebbar, akuter Schmerz, gegebenenfalls außerhalb der Sprechzeiten
      - nicht über die erbrachte Leistung. Dieselbe Nummer, etwa 2390 oder
      3000, kann im einen Fall AKUT sein und im anderen nicht. Eine Zuordnung
      allein anhand der Nummer wäre falsch.

ohne_gebuehrennummer:
  - art: material
    bezeichnung: Material- und Laborkosten nach Paragraf 9 GOZ
    leistungsbereich: null
    fundstelle: Paragraf 5
    begruendung: >
      Erstattungsfähig nach Paragraf 5 der Versicherungsbedingungen. Die
      Position folgt dem Leistungsbereich der Behandlung, für die das
      Material verwendet oder die Laborarbeit gefertigt wurde - eine Zirkonkrone folgt der Kronenversorgung nach ZE,
      ein Implantatkörper der Insertion nach IMP. Auf einer Rechnung mit
      mehreren Behandlungen entscheidet der Zahn, an dem die Position steht.
      Lässt sich die Hauptbehandlung nicht feststellen, ist die Position
      nicht zuzuordnen und gehört einem Menschen vorgelegt.
  - art: verlangen
    bezeichnung: Verlangensleistungen nach Paragraf 2 Absatz 3 GOZ
    leistungsbereich: null
    fundstelle: Paragraf 5
    begruendung: >
      Nicht erstattungsfähig. Auf Wunsch des Patienten erbracht und über das
      medizinisch Notwendige hinaus. Paragraf 5 der Versicherungsbedingungen
      setzt für jede Erstattung zahnmedizinische Notwendigkeit voraus; die
      ist hier gerade nicht gegeben. Die Position gehört trotzdem in die
      Rechnungsprüfung, damit sichtbar bleibt, warum sie nicht erstattet
      wird.

positionen:


  - nummer: "0010"
    bezeichnung: Eingehende Untersuchung zur Feststellung von Zahn-, Mund- und Kiefererkrankungen
    abschnitt: A
    leistungsbereich: null
    hinweis: Allgemeine Untersuchungsleistung ohne Bezug zu einem einzelnen Leistungsbereich.

  - nummer: "0030"
    bezeichnung: Aufstellung eines schriftlichen Heil- und Kostenplans nach Befundaufnahme
    abschnitt: A
    leistungsbereich: null
    hinweis: Planungsleistung; sie folgt dem Bereich der geplanten Behandlung, hat aber keinen eigenen.

  - nummer: "0040"
    bezeichnung: Aufstellung eines schriftlichen Heil- und Kostenplans bei kieferorthopädischer Behandlung oder bei funktionsanalytischen Maßnahmen
    abschnitt: A
    leistungsbereich: null
    hinweis: >
      Die Nummer ist nur für KFO oder FUN berechnungsfähig. Welcher der
      beiden Bereiche gilt, sagt die Nummer nicht - das ergibt sich erst aus
      der Behandlung.

  - nummer: "0050"
    bezeichnung: Abformung oder Teilabformung eines Kiefers für ein Situationsmodell
    abschnitt: A
    leistungsbereich: null

  - nummer: "0060"
    bezeichnung: Abformung beider Kiefer für Situationsmodelle und einfache Bissfixierung
    abschnitt: A
    leistungsbereich: null

  - nummer: "0065"
    bezeichnung: Optisch-elektronische Abformung einschließlich vorbereitender Maßnahmen
    abschnitt: A
    leistungsbereich: null

  - nummer: "0070"
    bezeichnung: Vitalitätsprüfung eines Zahnes oder mehrerer Zähne einschließlich Vergleichstest
    abschnitt: A
    leistungsbereich: null
    hinweis: Diagnostik; fällt häufig im Zusammenhang mit ZERH an, ist aber selbst keine Erhaltungsmaßnahme.

  - nummer: "0080"
    bezeichnung: Intraorale Oberflächenanästhesie
    abschnitt: A
    leistungsbereich: null
    hinweis: >
      Örtliche Betäubung. Nach dem Produktmodell ausdrücklich Teil der
      jeweiligen Behandlung und kein NAR.

  - nummer: "0090"
    bezeichnung: Intraorale Infiltrationsanästhesie
    abschnitt: A
    leistungsbereich: null
    hinweis: Örtliche Betäubung, kein NAR.

  - nummer: "0100"
    bezeichnung: Intraorale Leitungsanästhesie
    abschnitt: A
    leistungsbereich: null
    hinweis: Örtliche Betäubung, kein NAR.

  - nummer: "0110"
    bezeichnung: Zuschlag für die Anwendung eines Operationsmikroskops
    abschnitt: A
    leistungsbereich: null
    hinweis: Zuschlag ohne eigenen Leistungsinhalt; folgt der Hauptleistung.

  - nummer: "0120"
    bezeichnung: Zuschlag für die Anwendung eines Lasers
    abschnitt: A
    leistungsbereich: null
    hinweis: Zuschlag ohne eigenen Leistungsinhalt; folgt der Hauptleistung.


  - nummer: "1000"
    bezeichnung: Erstellung eines Mundhygienestatus und eingehende Unterweisung zur Vorbeugung
    abschnitt: B
    leistungsbereich: PZR

  - nummer: "1010"
    bezeichnung: Kontrolle des Übungserfolges einschließlich weiterer Unterweisung
    abschnitt: B
    leistungsbereich: PZR

  - nummer: "1020"
    bezeichnung: Lokale Fluoridierung zur Verbesserung der Zahnhartsubstanz, mit Lack oder Gel
    abschnitt: B
    leistungsbereich: PZR

  - nummer: "1030"
    bezeichnung: Lokale Anwendung von Medikamenten zur Kariesvorbeugung mit einer individuell gefertigten Schiene
    abschnitt: B
    leistungsbereich: PZR

  - nummer: "1040"
    bezeichnung: Professionelle Zahnreinigung
    abschnitt: B
    leistungsbereich: PZR
    hinweis: >
      Die namensgebende Position des Bereichs. Abzugrenzen von 4050 und 4055,
      der Zahnsteinentfernung bei parodontalem Befund - die gehört zu PAR.


  - nummer: "2000"
    bezeichnung: Versiegelung von kariesfreien Zahnfissuren mit aushärtenden Kunststoffen, je Zahn
    abschnitt: C
    leistungsbereich: PZR
    hinweis: >
      Steht im konservierenden Abschnitt, ist aber Vorbeugung ohne
      Krankheitsbefund. Das Produktmodell nennt die Fissurenversiegelung
      ausdrücklich bei PZR.

  - nummer: "2010"
    bezeichnung: Behandlung überempfindlicher Zahnflächen, je Kiefer
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2020"
    bezeichnung: Temporärer speicheldichter Verschluss einer Kavität
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2030"
    bezeichnung: Besondere Maßnahmen beim Präparieren oder Füllen von Kavitäten
    abschnitt: C
    leistungsbereich: ZERH
    hinweis: Begleitleistung zur Füllung; fällt auch bei der Präparation für eine Einlagefüllung an.

  - nummer: "2040"
    bezeichnung: Anlegen von Spanngummi, je Kieferhälfte oder Frontzahnbereich
    abschnitt: C
    leistungsbereich: ZERH
    hinweis: Begleitleistung; fällt bei Füllung, Einlagefüllung und Wurzelbehandlung gleichermaßen an.

  - nummer: "2050"
    bezeichnung: Präparieren einer Kavität und Restauration mit plastischem Füllungsmaterial, einflächig
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2060"
    bezeichnung: Präparieren einer Kavität und Restauration mit Kompositmaterialien in Adhäsivtechnik, einflächig
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2070"
    bezeichnung: Präparieren einer Kavität und Restauration mit plastischem Füllungsmaterial, zweiflächig
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2080"
    bezeichnung: Präparieren einer Kavität und Restauration mit Kompositmaterialien in Adhäsivtechnik, zweiflächig
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2090"
    bezeichnung: Präparieren einer Kavität und Restauration mit plastischem Füllungsmaterial, dreiflächig
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2100"
    bezeichnung: Präparieren einer Kavität und Restauration mit Kompositmaterialien in Adhäsivtechnik, dreiflächig
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2110"
    bezeichnung: Präparieren einer Kavität und Restauration mit plastischem Füllungsmaterial, mehr als dreiflächig
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2120"
    bezeichnung: Präparieren einer Kavität und Restauration mit Kompositmaterialien in Adhäsivtechnik, mehr als dreiflächig
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2130"
    bezeichnung: Kontrolle, Finieren/Polieren einer Restauration in separater Sitzung
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2150"
    bezeichnung: Einlagefüllung, einflächig
    abschnitt: C
    leistungsbereich: INL
    hinweis: >
      Einlagefüllung heißt im Labor gefertigt. Genau hier verläuft die im
      Modell gesetzte Grenze zu ZERH.

  - nummer: "2160"
    bezeichnung: Einlagefüllung, zweiflächig
    abschnitt: C
    leistungsbereich: INL

  - nummer: "2170"
    bezeichnung: Einlagefüllung, mehr als zweiflächig
    abschnitt: C
    leistungsbereich: INL

  - nummer: "2180"
    bezeichnung: Vorbereitung eines zerstörten Zahnes mit plastischem Aufbaumaterial zur Aufnahme einer Krone
    abschnitt: C
    leistungsbereich: ZERH
    hinweis: >
      Der Aufbau erhält den eigenen Zahn und wird im Produktmodell
      ausdrücklich ZERH zugeordnet, auch wenn er der späteren Krone dient.

  - nummer: "2190"
    bezeichnung: Vorbereitung eines zerstörten Zahnes durch gegossenen Aufbau mit Stiftverankerung
    abschnitt: C
    leistungsbereich: ZERH
    hinweis: Stiftaufbau, im Produktmodell namentlich ZERH zugeordnet.

  - nummer: "2195"
    bezeichnung: Vorbereitung eines zerstörten Zahnes durch einen Schraubenaufbau oder Glasfaserstift
    abschnitt: C
    leistungsbereich: ZERH
    hinweis: Stiftaufbau, im Produktmodell namentlich ZERH zugeordnet.

  - nummer: "2197"
    bezeichnung: Adhäsive Befestigung (plastischer Aufbau, Stift, Inlay, Krone, Teilkrone, Veneer)
    abschnitt: C
    leistungsbereich: null
    hinweis: >
      Reine Befestigungsleistung. Sie folgt dem, was befestigt wird: beim Inlay
      INL, bei Krone und Veneer ZE, beim Aufbau ZERH. Die Nummer allein
      entscheidet nicht.

  - nummer: "2200"
    bezeichnung: Versorgung eines Zahnes oder Implantats durch eine Vollkrone (Tangentialpräparation)
    abschnitt: C
    leistungsbereich: ZE
    hinweis: >
      Die Nummer erfasst ausdrücklich auch die Krone auf dem Implantat. Nach
      dem Produktmodell gehört sie zu ZE, nicht zu IMP.

  - nummer: "2210"
    bezeichnung: Versorgung eines Zahnes durch eine Vollkrone (Hohlkehl- oder Stufenpräparation)
    abschnitt: C
    leistungsbereich: ZE
    hinweis: Im Zusammenhang mit Implantaten nicht berechnungsfähig; dort gilt 2200.

  - nummer: "2220"
    bezeichnung: Versorgung eines Zahnes durch eine Teilkrone oder ein Veneer
    abschnitt: C
    leistungsbereich: ZE
    hinweis: >
      Das Veneer steht in derselben Nummer. Ohne medizinische Indikation
      greift der Ausschluss KOSMETIK des Produktmodells - das entscheidet
      aber nicht die Nummer, sondern die Indikation.

  - nummer: "2230"
    bezeichnung: Teilleistung zu den Nummern 2200 bis 2220, Ende mit der Präparation
    abschnitt: C
    leistungsbereich: ZE

  - nummer: "2240"
    bezeichnung: Teilleistung zu den Nummern 2200 bis 2220, weitergehende Maßnahmen
    abschnitt: C
    leistungsbereich: ZE

  - nummer: "2250"
    bezeichnung: Eingliederung einer konfektionierten Krone in der pädiatrischen Zahnheilkunde
    abschnitt: C
    leistungsbereich: ZE
    hinweis: >
      Kinderleistung. Im Modell mit Eintrittsalter ab 18 Jahren praktisch ohne
      Bedeutung, der Vollständigkeit halber geführt.

  - nummer: "2260"
    bezeichnung: Provisorium im direkten Verfahren ohne Abformung, je Zahn oder Implantat
    abschnitt: C
    leistungsbereich: ZE
    hinweis: >
      Provisorien überbrücken die Zeit bis zur endgültigen Versorgung. Sie
      werden dem Zahnersatz zugeordnet; bei einer Inlay-Versorgung wäre INL
      zutreffender.

  - nummer: "2270"
    bezeichnung: Provisorium im direkten Verfahren mit Abformung, je Zahn oder Implantat
    abschnitt: C
    leistungsbereich: ZE
    hinweis: Siehe 2260.

  - nummer: "2290"
    bezeichnung: Entfernung einer Einlagefüllung, einer Krone oder eines Brückenankers
    abschnitt: C
    leistungsbereich: ZE
    hinweis: >
      Drei der vier genannten Fälle betreffen Zahnersatz; bei der Entfernung
      einer Einlagefüllung wäre INL zutreffender.

  - nummer: "2300"
    bezeichnung: Entfernung eines Wurzelstiftes
    abschnitt: C
    leistungsbereich: ZERH
    hinweis: Regelmäßig Vorbereitung einer Wurzelkanalrevision.

  - nummer: "2310"
    bezeichnung: Wiedereingliederung einer Einlagefüllung, einer Teilkrone, eines Veneers oder einer Krone
    abschnitt: C
    leistungsbereich: ZE
    hinweis: Bei der Wiedereingliederung einer Einlagefüllung wäre INL zutreffender.

  - nummer: "2320"
    bezeichnung: Wiederherstellung einer Krone, einer Teilkrone oder einer Verblendung an festsitzendem Zahnersatz
    abschnitt: C
    leistungsbereich: ZE

  - nummer: "2330"
    bezeichnung: Maßnahmen zur Erhaltung der vitalen Pulpa bei Caries profunda, indirekte Überkappung
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2340"
    bezeichnung: Maßnahmen zur Erhaltung der freiliegenden vitalen Pulpa, direkte Überkappung
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2350"
    bezeichnung: Amputation und Versorgung der vitalen Pulpa einschließlich Exkavieren
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2360"
    bezeichnung: Exstirpation der vitalen Pulpa einschließlich Exkavieren, je Kanal
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2380"
    bezeichnung: Amputation und endgültige Versorgung der avitalen Milchzahnpulpa
    abschnitt: C
    leistungsbereich: ZERH
    hinweis: Milchzahnleistung; im Modell für Erwachsene praktisch ohne Bedeutung.

  - nummer: "2390"
    bezeichnung: Trepanation eines Zahnes, als selbstständige Leistung
    abschnitt: C
    leistungsbereich: ZERH
    hinweis: >
      Als selbstständige Leistung typischerweise Schmerzbehandlung. Ob AKUT
      vorliegt, entscheidet aber die Behandlungssituation, nicht die Nummer.

  - nummer: "2400"
    bezeichnung: Elektrometrische Längenbestimmung eines Wurzelkanals
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2410"
    bezeichnung: Aufbereitung eines Wurzelkanals, auch retrograd, je Kanal
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2420"
    bezeichnung: Zusätzliche Anwendung elektrophysikalisch-chemischer Methoden, je Kanal
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2430"
    bezeichnung: Medikamentöse Einlage, je Zahn und Sitzung
    abschnitt: C
    leistungsbereich: ZERH

  - nummer: "2440"
    bezeichnung: Füllung eines Wurzelkanals
    abschnitt: C
    leistungsbereich: ZERH


  - nummer: "3000"
    bezeichnung: Entfernung eines einwurzeligen Zahnes oder eines enossalen Implantats
    abschnitt: D
    leistungsbereich: null
    hinweis: >
      Zahnentfernung. Weder Zahnerhalt noch Zahnersatz; das Modell kennt
      dafür keinen Bereich.

  - nummer: "3010"
    bezeichnung: Entfernung eines mehrwurzeligen Zahnes
    abschnitt: D
    leistungsbereich: null
    hinweis: Siehe 3000.

  - nummer: "3020"
    bezeichnung: Entfernung eines tief frakturierten oder tief zerstörten Zahnes
    abschnitt: D
    leistungsbereich: null
    hinweis: Siehe 3000.

  - nummer: "3030"
    bezeichnung: Entfernung eines Zahnes oder eines enossalen Implantats durch Osteotomie
    abschnitt: D
    leistungsbereich: null
    hinweis: >
      Auch die Entfernung eines Implantats fällt hierunter. Sie ist keine
      Implantatversorgung und daher kein IMP.

  - nummer: "3040"
    bezeichnung: Entfernung eines retinierten, impaktierten oder verlagerten Zahnes durch Osteotomie
    abschnitt: D
    leistungsbereich: null
    hinweis: Siehe 3000.

  - nummer: "3045"
    bezeichnung: Entfernen eines extrem verlagerten oder retinierten Zahnes durch umfangreiche Osteotomie
    abschnitt: D
    leistungsbereich: null
    hinweis: Siehe 3000.

  - nummer: "3050"
    bezeichnung: Stillung einer übermäßigen Blutung im Mund- und Kieferbereich
    abschnitt: D
    leistungsbereich: null
    hinweis: >
      Häufige Akutsituation, aber die Nummer sagt nichts darüber, ob die
      Behandlung unaufschiebbar war.

  - nummer: "3060"
    bezeichnung: Stillung einer Blutung durch Abbinden oder Umstechen des Gefäßes
    abschnitt: D
    leistungsbereich: null
    hinweis: Siehe 3050.

  - nummer: "3070"
    bezeichnung: Exzision von Schleimhaut oder Granulationsgewebe
    abschnitt: D
    leistungsbereich: null

  - nummer: "3080"
    bezeichnung: Exzision einer Schleimhautwucherung größeren Umfangs
    abschnitt: D
    leistungsbereich: null

  - nummer: "3090"
    bezeichnung: Plastischer Verschluss einer eröffneten Kieferhöhle
    abschnitt: D
    leistungsbereich: null

  - nummer: "3100"
    bezeichnung: Plastische Deckung im Rahmen einer Wundversorgung einschließlich Periostschlitzung
    abschnitt: D
    leistungsbereich: null

  - nummer: "3110"
    bezeichnung: Resektion einer Wurzelspitze an einem Frontzahn
    abschnitt: D
    leistungsbereich: ZERH
    hinweis: >
      Die Wurzelspitzenresektion ist der chirurgische Weg zum Erhalt des
